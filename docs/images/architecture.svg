<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="title desc">
  <title id="title">我不是魔王本地作弊 Mod 架构图</title>
  <desc id="desc">两条路径：默认由加载器通过 Chrome DevTools 协议在运行时注入 cheat.js；可选地把 cheat.js 离线写入 app.asar，并同步 exe 的 asar 完整性哈希。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1b2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162338"/>
      <stop offset="1" stop-color="#111c2f"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="url(#bg)"/>
  <rect width="1200" height="840" fill="url(#grid)"/>
  <circle cx="1090" cy="70" r="220" fill="#22d3ee" opacity="0.055"/>
  <circle cx="80" cy="770" r="240" fill="#fbbf24" opacity="0.045"/>

  <!-- header -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <rect x="60" y="38" width="214" height="28" rx="14" fill="#22d3ee" opacity="0.1" stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle cx="76" cy="52" r="3.5" fill="#22d3ee"/>
    <text x="88" y="57" fill="#67e8f9" font-size="12" letter-spacing="1.2">ARCHITECTURE · 架构总览</text>
    <text x="60" y="110" fill="#f8fafc" font-size="30" font-weight="700">两种注入路径，一个 exe</text>
    <text x="60" y="139" fill="#94a3b8" font-size="14">默认运行时注入，不碰游戏文件；需要时再离线写入 app.asar。</text>
    <g transform="translate(1000 44)">
      <rect x="0" y="0" width="140" height="46" rx="12" fill="#111c2f" stroke="#1e3a5f"/>
      <text x="18" y="20" fill="#64748b" font-size="10" letter-spacing="1">SINGLE BINARY</text>
      <text x="18" y="36" fill="#e2e8f0" font-size="12">无运行时依赖</text>
    </g>
  </g>

  <!-- runtime lane -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <rect x="48" y="168" width="1104" height="262" rx="18" fill="url(#panel)" stroke="#1e3a5f"/>
    <rect x="70" y="188" width="262" height="30" rx="15" fill="#22d3ee" opacity="0.09" stroke="#22d3ee" stroke-opacity="0.3"/>
    <text x="86" y="208" fill="#67e8f9" font-size="12" font-weight="600">01　运行时注入 · 推荐 · 默认</text>
    <text x="1130" y="208" fill="#64748b" font-size="12" text-anchor="end">不修改 app.asar / exe</text>

    <!-- loader -->
    <g filter="url(#shadow)">
      <rect x="76" y="238" width="220" height="126" rx="12" fill="#0f1b2e" stroke="#22d3ee" stroke-opacity="0.45"/>
    </g>
    <rect x="92" y="252" width="34" height="34" rx="9" fill="#22d3ee" opacity="0.12"/>
    <path d="M105 262l12 7.5-12 7.5z" fill="#67e8f9"/>
    <text x="138" y="268" fill="#f8fafc" font-size="14" font-weight="700">Mod Loader</text>
    <text x="138" y="284" fill="#64748b" font-size="10">Go · mygo 原生 UI</text>
    <text x="94" y="317" fill="#cbd5e1" font-size="11">启动游戏并注入</text>
    <text x="94" y="338" fill="#94a3b8" font-size="11">内嵌 cheat.js · 单文件</text>
    <rect x="94" y="347" width="64" height="7" rx="3.5" fill="#22d3ee" opacity="0.25"/>

    <!-- game -->
    <g filter="url(#shadow)">
      <rect x="344" y="238" width="238" height="126" rx="12" fill="#0f1b2e" stroke="#334155"/>
    </g>
    <rect x="360" y="252" width="34" height="34" rx="9" fill="#38bdf8" opacity="0.1"/>
    <rect x="367" y="259" width="20" height="16" rx="2" fill="none" stroke="#7dd3fc" stroke-width="1.6"/>
    <path d="M365 279h24" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
    <text x="406" y="268" fill="#f8fafc" font-size="14" font-weight="700">游戏进程</text>
    <text x="406" y="284" fill="#64748b" font-size="10">Electron / Cocos 3.7</text>
    <text x="362" y="317" fill="#cbd5e1" font-size="11" font-family="'Cascadia Code', Consolas, monospace">ImNoDemonlord.exe</text>
    <text x="362" y="338" fill="#94a3b8" font-size="11" font-family="'Cascadia Code', Consolas, monospace">--remote-debugging-port=9222</text>
    <rect x="362" y="347" width="96" height="7" rx="3.5" fill="#38bdf8" opacity="0.2"/>

    <!-- cdp -->
    <g filter="url(#shadow)">
      <rect x="632" y="238" width="224" height="126" rx="12" fill="#0f1b2e" stroke="#334155"/>
    </g>
    <rect x="648" y="252" width="34" height="34" rx="9" fill="#a78bfa" opacity="0.12"/>
    <path d="M657 266h16M657 272h16M657 278h10" stroke="#c4b5fd" stroke-width="1.6" stroke-linecap="round"/>
    <text x="694" y="268" fill="#f8fafc" font-size="14" font-weight="700">CDP 通道</text>
    <text x="694" y="284" fill="#64748b" font-size="10">WebSocket</text>
    <text x="650" y="317" fill="#cbd5e1" font-size="11" font-family="'Cascadia Code', Consolas, monospace">GET /json/list</text>
    <text x="650" y="338" fill="#94a3b8" font-size="11">Page · Runtime</text>
    <rect x="650" y="347" width="78" height="7" rx="3.5" fill="#a78bfa" opacity="0.22"/>

    <!-- page -->
    <g filter="url(#shadow)">
      <rect x="906" y="238" width="218" height="126" rx="12" fill="#0f1b2e" stroke="#34d399" stroke-opacity="0.5"/>
    </g>
    <rect x="922" y="252" width="34" height="34" rx="9" fill="#34d399" opacity="0.12"/>
    <path d="M931 263h16v13h-16zM931 279h16" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="968" y="268" fill="#f8fafc" font-size="14" font-weight="700">游戏页面</text>
    <text x="968" y="284" fill="#64748b" font-size="10">已注入</text>
    <text x="924" y="317" fill="#cbd5e1" font-size="11" font-family="'Cascadia Code', Consolas, monospace">web-mobile/index.html</text>
    <text x="924" y="338" fill="#94a3b8" font-size="11">cheat.js + DOM 面板</text>
    <rect x="924" y="347" width="72" height="7" rx="3.5" fill="#34d399" opacity="0.3"/>

    <!-- arrows -->
    <line x1="298" y1="301" x2="338" y2="301" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="318" y="290" fill="#67e8f9" font-size="10" text-anchor="middle">① 启动</text>
    <line x1="584" y1="301" x2="626" y2="301" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="605" y="290" fill="#67e8f9" font-size="10" text-anchor="middle">② 发现</text>
    <line x1="858" y1="301" x2="900" y2="301" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="879" y="290" fill="#67e8f9" font-size="10" text-anchor="middle">③ 注入</text>

    <rect x="76" y="384" width="492" height="28" rx="8" fill="#0b1220" stroke="#1e3a5f"/>
    <circle cx="92" cy="398" r="4" fill="#34d399"/>
    <text x="104" y="402" fill="#94a3b8" font-size="11">已注入 · cheat v1.0.0 · 关闭游戏即结束</text>
    <rect x="586" y="384" width="538" height="28" rx="8" fill="#0b1220" stroke="#1e3a5f"/>
    <text x="604" y="402" fill="#94a3b8" font-size="11">Page.loadEventFired　→　页面刷新后自动重新注入</text>
  </g>

  <!-- offline lane -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <rect x="48" y="456" width="1104" height="286" rx="18" fill="url(#panel)" stroke="#3f2d12"/>
    <rect x="70" y="476" width="286" height="30" rx="15" fill="#fbbf24" opacity="0.09" stroke="#fbbf24" stroke-opacity="0.3"/>
    <text x="86" y="496" fill="#fcd34d" font-size="12" font-weight="600">02　离线安装 · 可选 · 修改游戏文件</text>
    <text x="1130" y="496" fill="#64748b" font-size="12" text-anchor="end">自动备份 · 可一键还原</text>

    <!-- five stages -->
    <g filter="url(#shadow)"><rect x="66" y="530" width="194" height="132" rx="12" fill="#0f1b2e" stroke="#fbbf24" stroke-opacity="0.4"/></g>
    <text x="84" y="558" fill="#fcd34d" font-size="10" font-weight="700">STEP 1</text>
    <text x="84" y="582" fill="#f8fafc" font-size="13" font-weight="700">内嵌脚本</text>
    <text x="84" y="605" fill="#94a3b8" font-size="10.5">cheat.js 随 exe 分发</text>
    <text x="84" y="625" fill="#64748b" font-size="10.5">无需外部文件</text>

    <g filter="url(#shadow)"><rect x="283" y="530" width="194" height="132" rx="12" fill="#0f1b2e" stroke="#334155"/></g>
    <text x="301" y="558" fill="#fbbf24" font-size="10" font-weight="700">STEP 2</text>
    <text x="301" y="582" fill="#f8fafc" font-size="13" font-weight="700">备份原始包</text>
    <text x="301" y="605" fill="#94a3b8" font-size="10.5" font-family="'Cascadia Code', Consolas, monospace">app.asar.bak</text>
    <text x="301" y="625" fill="#64748b" font-size="10.5">仅首次安装时创建</text>

    <g filter="url(#shadow)"><rect x="500" y="530" width="194" height="132" rx="12" fill="#0f1b2e" stroke="#334155"/></g>
    <text x="518" y="558" fill="#fbbf24" font-size="10" font-weight="700">STEP 3</text>
    <text x="518" y="582" fill="#f8fafc" font-size="13" font-weight="700">重打包 asar</text>
    <text x="518" y="605" fill="#94a3b8" font-size="10.5">写入 index.html 与 cheat.js</text>
    <text x="518" y="625" fill="#64748b" font-size="10.5">重排 offset · 回读校验</text>

    <g filter="url(#shadow)"><rect x="717" y="530" width="194" height="132" rx="12" fill="#0f1b2e" stroke="#334155"/></g>
    <text x="735" y="558" fill="#fbbf24" font-size="10" font-weight="700">STEP 4</text>
    <text x="735" y="582" fill="#f8fafc" font-size="13" font-weight="700">同步完整性</text>
    <text x="735" y="605" fill="#94a3b8" font-size="10.5">写 exe 的 asar SHA-256</text>
    <text x="735" y="625" fill="#64748b" font-size="10.5" font-family="'Cascadia Code', Consolas, monospace">INTEGRITY / ELECTRONASAR</text>

    <g filter="url(#shadow)"><rect x="934" y="530" width="190" height="132" rx="12" fill="#0f1b2e" stroke="#34d399" stroke-opacity="0.45"/></g>
    <text x="952" y="558" fill="#6ee7b7" font-size="10" font-weight="700">STEP 5</text>
    <text x="952" y="582" fill="#f8fafc" font-size="13" font-weight="700">任意入口启动</text>
    <text x="952" y="605" fill="#94a3b8" font-size="10.5">菜单自带作弊面板</text>
    <text x="952" y="625" fill="#6ee7b7" font-size="10.5">按 F2 打开</text>

    <line x1="260" y1="596" x2="277" y2="596" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <line x1="477" y1="596" x2="494" y2="596" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <line x1="694" y1="596" x2="711" y2="596" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <line x1="911" y1="596" x2="928" y2="596" stroke="#34d399" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <rect x="66" y="682" width="656" height="28" rx="8" fill="#0b1220" stroke="#3f2d12"/>
    <text x="82" y="700" fill="#94a3b8" font-size="11">失败自动回滚　·　uninstall 用备份还原 asar 与 exe 哈希</text>
    <rect x="740" y="682" width="384" height="28" rx="8" fill="#0b1220" stroke="#3f2d12"/>
    <text x="756" y="700" fill="#94a3b8" font-size="11">游戏更新前先还原，更新后重新安装</text>
  </g>

  <!-- footer -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <line x1="60" y1="776" x2="1140" y2="776" stroke="#1e293b"/>
    <text x="60" y="804" fill="#94a3b8" font-size="12">一个 exe　·　终端用户无需 Python / Node.js / Go　·　默认路径不写游戏目录</text>
    <text x="1140" y="804" fill="#475569" font-size="11" text-anchor="end">MIT · 仅供单机自用</text>
  </g>
</svg>
