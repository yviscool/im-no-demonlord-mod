name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: loader/go.mod
          cache-dependency-path: loader/go.sum

      - name: Check formatting
        run: |
          cd loader
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Check embedded cheat.js is in sync
        run: |
          cp src/cheat.js loader/assets/cheat.js
          git diff --exit-code -- loader/assets/cheat.js

      - name: Build
        run: |
          mkdir -p dist
          cd loader
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/ImNoDemonlord-ModLoader.exe .

      - name: Package
        run: go run tools/package/main.go

      - uses: actions/upload-artifact@v4
        with:
          name: ImNoDemonlord-LocalCheat
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
